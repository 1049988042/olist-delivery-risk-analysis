name: Portfolio Python static checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax without private CSV files
        run: python -m compileall -q -f run_project.py audit_olist.py deep_audit.py build_review_timing_report.py review_timing_study.py decision_study portfolio_delivery
